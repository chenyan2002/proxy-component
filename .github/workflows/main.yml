name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      WAC_VERSION: 0.12.0
      VICEROY_VERSION: 0.21.1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown, wasm32-wasip2
          components: rustfmt, clippy
          toolchain: 1.99.0
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install wac
        run: |
          tmp=$(mktemp -d)
          curl -sLo "$tmp/wac-cli" https://github.com/bytecodealliance/wac/releases/download/v${{ env.WAC_VERSION }}/wac-cli-x86_64-unknown-linux-musl
          chmod a+x "$tmp/wac-cli"
          mv "$tmp/wac-cli" /usr/local/bin/wac
      - name: Install viceroy
        run: |
          # viceroy may be restored from the cache in ~/.cargo/bin
          command -v viceroy || RUSTFLAGS="--cap-lints=warn" cargo install --git https://github.com/fastly/Viceroy.git --branch yan/adapt-ps1 --locked viceroy
#          tmp=$(mktemp -d)
#          curl -sLo "$tmp/viceroy.tar.gz" https://github.com/fastly/Viceroy/releases/download/v${{ env.VICEROY_VERSION }}/viceroy_v${{ env.VICEROY_VERSION }}_linux-amd64.tar.gz
#          tar -xz -f "$tmp/viceroy.tar.gz" -C "$tmp"
#          chmod a+x "$tmp/viceroy"
#          mv "$tmp/viceroy" /usr/local/bin/
      - name: Build
        run: make
      - name: Test
        run: make test
