[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
trace = { path = "../../crates/trace" }
serde_json.workspace = true
wit-bindgen.workspace = true
libc-alloc = { path = "../../crates/libc-alloc", optional = true }
fastly-sys = { version = "0.13.2", optional = true }

[features]
# Link with 1-byte wasm pages (see build.rs)
one-byte-page = ["dep:libc-alloc"]
# Write the trace to a Fastly log endpoint instead of stdout (see `emit` in src/lib.rs)
fastly = ["dep:fastly-sys"]
